# install prek package (instead of python pre-commit)
#  brew install prek
# register as git commit-hook to run automatically
#  prek install
# run manually
#  prek run --all-files
# update hooks to latest version
#  prek autoupdate#:schema https://www.schemastore.org/prek.json

exclude = """
(?x)^(
  chapters/translations/.*|
  fonts/.*|
  scripts/compare-translations.py|
  scripts/ebook/v1/.*
)$
"""

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", args = [
    "--maxkb=500",
  ] },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-json" },
  { id = "check-json5" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-vcs-permalinks" },
  { id = "check-xml" },
  { id = "check-yaml" },
  { id = "destroyed-symlinks" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "file-contents-sorter", files = "^(.gitignore|cspell-words.txt)$", args = [
    "--ignore-case",
  ] },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending", args = [
    "--fix=lf",
  ] },
  { id = "requirements-txt-fixer" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.57"
hooks = [{ id = "rumdl" }, { id = "rumdl-fmt" }]
# id = "rumdl" , args = ["--fix"]

[[repos]]
repo = "https://github.com/owenlamont/ryl-pre-commit"
rev = "v0.21.0"
hooks = [{ id = "ryl", args = ["--fix"] }]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.13.1-1"
hooks = [{ id = "shfmt", args = ["-w", "-i", "2", "-ci"] }]
